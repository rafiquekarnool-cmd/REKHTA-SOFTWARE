name: Build REKHTA Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "main.js"
      - "package.json"
      - ".github/workflows/build-exe.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload REKHTA installer
        uses: actions/upload-artifact@v4
        with:
          name: REKHTA-Windows-Installer
          path: |
            dist/*.exe
          if-no-files-found: error
          retention-days: 30
