name: REKHTA 3.7 Windows 8 x64
on:
  push:
    branches: [build/rekhta-3-7-win8-20260930]
    paths:
      - desktop-3.7/**
      - .github/workflows/rekhta-3-7-win8.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop-3.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install pinned dependencies and offline export libraries
        run: npm install --no-audit --no-fund
      - name: Verify editor, font, Ctrl Space, mixed typing, arrows and mouse
        run: npm run smoke
      - name: Build Windows 8 x64 installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: REKHTA-3.7-Windows8-x64
          path: desktop-3.7/dist/*.exe
          if-no-files-found: error
          retention-days: 30
