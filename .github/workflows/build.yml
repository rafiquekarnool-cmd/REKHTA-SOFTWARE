name: Build REKHTA Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) {
            npm ci
          } else {
            npm install
          }

      - name: Build Windows installer
        run: npm run dist

      - name: Upload REKHTA installer
        uses: actions/upload-artifact@v4
        with:
          name: REKHTA-Windows-Setup
          path: |
            dist/*.exe
          if-no-files-found: error
