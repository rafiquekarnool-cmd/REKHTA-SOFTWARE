name: REKHTA stability tests only
on:
  push:
    branches: [test/rekhta-stability-20261001]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop-3.7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - name: Test editor interactions and native export without building EXE
        run: npm run smoke
