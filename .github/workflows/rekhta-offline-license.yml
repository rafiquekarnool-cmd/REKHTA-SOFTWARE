name: REKHTA Offline Licensed EXE
on:
  push:
    branches: [test/rekhta-stability-20261001]
    paths: [desktop-3.7/**, offline-licensing/customer/**, .github/workflows/rekhta-offline-license.yml]
  workflow_dispatch:
    inputs:
      build_exe:
        description: Build installer only when explicitly requested
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare current verified editor
        run: npm install
        working-directory: desktop-3.7
      - name: Stage offline desktop files
        shell: pwsh
        run: |
          Copy-Item desktop-3.7/REKHTA.html offline-licensing/customer/REKHTA.html
          Copy-Item desktop-3.7/assets offline-licensing/customer/assets -Recurse -Force
          Copy-Item desktop-3.7/scripts offline-licensing/customer/scripts -Recurse -Force
          Copy-Item desktop-3.7/vendor offline-licensing/customer/vendor -Recurse -Force
      - name: Apply current welcome and design gallery updates
        run: node apply-recent-updates.cjs
        working-directory: offline-licensing/customer
      - name: Install licensed build dependencies
        run: npm install
        working-directory: offline-licensing/customer
      - name: Test offline license verification
        run: npm test
        working-directory: offline-licensing/customer
      - name: Test selected line size isolation
        run: npx electron line-size-test.cjs
        working-directory: offline-licensing/customer
      - name: Test trace, Smart Fill and native Urdu curves
        if: success() || failure()
        run: npx electron vector-additions-test.cjs
        working-directory: offline-licensing/customer
      - name: Build Windows 8 x64 installer
        if: github.event_name == 'workflow_dispatch' && inputs.build_exe
        run: npm run dist
        working-directory: offline-licensing/customer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Test text editing and InPage insertion
        if: success() || failure()
        run: npx electron editing-test.cjs
        working-directory: offline-licensing/customer
      - name: Test automatic pagination and multi-page print/export
        if: success() || failure()
        run: npx electron pagination-test.cjs
        working-directory: offline-licensing/customer
      - name: Test offline background remover and welcome layout
        if: success() || failure()
        run: npx electron background-remover-test.cjs
        working-directory: offline-licensing/customer
      - name: Test browser OCR Urdu paste direction
        if: success() || failure()
        run: npx electron rtl-paste-test.cjs
        working-directory: offline-licensing/customer
      - name: Test direct CorelDRAW EPS export
        if: success() || failure()
        run: npx electron eps-export-test.cjs
        working-directory: offline-licensing/customer
      - name: Confirm installer built
        if: github.event_name == 'workflow_dispatch' && inputs.build_exe
        run: node -e "if(!require('fs').readdirSync('dist').some(f=>f.endsWith('.exe')))process.exit(1)"
        working-directory: offline-licensing/customer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: REKHTA-Offline-Licensed-Win8-x64
          path: |
            offline-licensing/customer/dist/*.exe
            offline-licensing/customer/test-output/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: REKHTA-vector-test-failure
          path: offline-licensing/customer/test-output/*

