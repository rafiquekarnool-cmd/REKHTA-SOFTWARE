name: Build RK Design Studio Win8 EXE

on:
  pull_request:
    branches: [main]
    paths:
      - "rk-design-studio/**"
      - ".github/workflows/build-rk-design-studio.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rk-design-studio
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Restore editor and Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build" | Out-Null
          $index64 = (Get-ChildItem "upload/index.b64.part*" | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("index.html", [Convert]::FromBase64String($index64))
          $icon64 = (Get-ChildItem "upload/icon.b64.part*" | Sort-Object Name | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("build/icon.ico", [Convert]::FromBase64String($icon64))
      - name: Install dependencies
        run: npm install
      - name: Build Windows 8 x64 installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: RK-Design-Studio-V8.24-Win8-x64
          path: rk-design-studio/dist/*.exe
          if-no-files-found: error
